name: CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,web]"
      # Offline suite (deterministic policy engine); no Bedrock credentials needed.
      - run: python -m pytest -q
