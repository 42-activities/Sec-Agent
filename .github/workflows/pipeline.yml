name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    uses: ./.github/workflows/docker-deploy.yml
    with:
      images: '[{"name": "app", "context": "."}]'
      deploy-path: ~/projects/Sec-Agent
      health-url: http://127.0.0.1:8700/health
    secrets: inherit
